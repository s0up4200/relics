[package]
name = "relics"
version = "0.1.0"
edition = "2024"
publish = false

# The gpui crates move in lockstep: gpui-kit 0.7.0 pins gpui-pre =0.3.7, and
# gpui-pre-reqwest-client and gpui-pre-http-client must have the same version as gpui-pre.
# Each pin must be 7 days old or more. Raise them together, one bump per PR.
[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui-kit = { version = "=0.7.0", default-features = false, features = ["assets"] }
gpui-omarchy = "=0.2.0"
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.7" }
libmpv2 = { version = "=6.0.0", default-features = false, features = ["render"] }
# The video surface of the Player view (ADR 0003). The versions and features match the crates that gpui
# already pulls in, so the lock gets no new crates.
raw-window-handle = "0.6.2"
wayland-client = "0.31.15"
wayland-backend = { version = "0.3.17", features = ["client_system", "dlopen"] }
khronos-egl = { version = "6.0.0", features = ["dynamic"] }
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
# The version check of the Release notice. Already in Cargo.lock, so the lock gets no new crates.
semver = "1.0.28"
# The same version and features as gpui-pre-linux, so the lock gets no new crates.
oo7 = { version = "=0.6.0", default-features = false, features = ["async-std", "native_crypto"] }
uuid = { version = "1.28.0", features = ["v4"] }
gethostname = "1.1.0"
# Artwork cache. image, sha2 and base64 are already in Cargo.lock from gpui.
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
sha2 = "0.10.9"
base64 = "0.22.1"
thumbhash = "=0.1.0"
# The Local settings file. The same version as gpui-omarchy, so the lock gets no new crates.
toml = "=0.8.23"
# MPRIS. Its zbus is already in Cargo.lock with the async-io runtime, so the app gets no second async runtime.
mpris-server = "=0.10.0"
# The events socket of Live updates (ADR 0006), on the async-io runtime that zbus already brings and with the TLS
# config of the HTTP client (http_client_tls). Only src/api/live.rs may use it (clippy.toml).
async-tungstenite = { version = "=0.35.0", default-features = false, features = ["smol-runtime", "futures-rustls-manual-roots"] }
futures-rustls = { version = "=0.26.0", default-features = false }
http_client_tls = { package = "gpui-pre-http-client-tls", version = "=0.3.7" }
async-io = "2.6.0"
# The TCP stream of the events socket, and the NO_PROXY rules of reqwest (hyper-util's Matcher) for the tunnel through
# the proxy of the HTTP client. client-proxy adds only base64 0.23 to the lock.
async-net = "=2.0.0"
hyper-util = { version = "=0.1.21", default-features = false, features = ["client-proxy"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.7", features = ["test-support"] }
http_client = { package = "gpui-pre-http-client", version = "=0.3.7", features = ["test-support"] }

# Each unsafe block and unsafe impl needs a `// SAFETY:` comment that says why the code is sound.
[lints.clippy]
undocumented_unsafe_blocks = "warn"
