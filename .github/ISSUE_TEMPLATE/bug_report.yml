name: Bug report
description: Something in Relics does not work as you expect.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > Before you open an issue, search the existing [issues](https://github.com/s0up4200/relics/issues).
        >
        > Relics is not affiliated with the Silo project. If the problem also occurs in the Silo web app, report it to Silo.

  - type: textarea
    attributes:
      label: Description
      description: |
        - What happened?
        - What did you expect to happen?
      placeholder: |
        When I play an episode, the video stays black. The audio plays.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a series in the Library.
        2. Play an episode.
        3. The video stays black.

  - type: textarea
    attributes:
      label: Environment
      description: |
        - Relics version (`relics --version`)
        - Silo server version
        - How you installed Relics (release package or build from source)
        - Desktop (Omarchy, or another Wayland desktop) and its version
        - mpv version (`mpv --version`)
        - GPU and driver, for a problem with the video
      placeholder: |
        - Relics 0.1.0 (abc1234)
        - Silo: 1.2.0
        - Release package
        - Omarchy 3.1
        - mpv 0.40.0
        - AMD Radeon 780M, Mesa 25.2
      render: text
    validations:
      required: true

  - type: textarea
    attributes:
      label: Relevant logs
      description: |
        Relics writes its log to the terminal. To capture it, start Relics from a terminal, reproduce the problem, and then close Relics:

        ```sh
        relics 2>&1 | tee relics.log
        ```

        Paste the lines that are near the problem. Before you paste the log, remove each token and your Silo server address.
      render: text

  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues
          required: true
        - label: I removed each token and my Silo server address from the logs and the screenshots
          required: true
